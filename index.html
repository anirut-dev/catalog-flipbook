<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangudom Catalog 2021</title>
  <meta name="description" content="แคตตาล็อกสินค้า Sangudom Lighting Centre 2021 แบบพลิกหน้าอ่านได้">
  <link rel="stylesheet" href="lib/stPageFlip.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="pages/page-001.webp">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Sangudom Lighting Centre — Catalog 2021</h1>
  </header>

  <main class="viewer">
    <!-- StPageFlip forces width:100% on its own container, so the size limit
         has to live on this wrapper. js/app.js sets its width. -->
    <div class="book-frame" id="book-frame">
      <div id="flipbook" class="flipbook"></div>
    </div>

    <div class="loading" id="loading">กำลังโหลด…</div>
  </main>

  <!-- Zoom overlay: uses the sharp pages/zoom/ image, loaded only when opened. -->
  <div class="zoom" id="zoom" hidden>
    <div class="zoom__stage" id="zoom-stage">
      <img class="zoom__img" id="zoom-img" alt="" draggable="false">
    </div>
    <div class="zoom__bar">
      <button type="button" class="btn" id="zoom-prev" aria-label="หน้าก่อนหน้า">‹</button>
      <button type="button" class="btn" id="zoom-out" aria-label="ย่อ">−</button>
      <span class="zoom__level" id="zoom-level">100%</span>
      <button type="button" class="btn" id="zoom-in" aria-label="ขยาย">+</button>
      <button type="button" class="btn" id="zoom-next" aria-label="หน้าถัดไป">›</button>
      <button type="button" class="btn btn--close" id="zoom-close" aria-label="ปิด">✕</button>
    </div>
    <p class="zoom__page" id="zoom-page">หน้า 1</p>
  </div>

  <!-- Page picker: 232 thumbnails, loaded lazily by the browser. -->
  <div class="thumbs" id="thumbs" hidden>
    <div class="thumbs__head">
      <span>เลือกหน้า</span>
      <button type="button" class="btn btn--close" id="thumbs-close" aria-label="ปิด">✕</button>
    </div>
    <div class="thumbs__strip" id="thumbs-strip"></div>
  </div>

  <nav class="controls" aria-label="ควบคุมการพลิกหน้า">
    <button type="button" id="btn-prev" class="btn" aria-label="หน้าก่อนหน้า">‹</button>

    <form class="pager" id="pager">
      <label class="pager__label" for="page-input">หน้า</label>
      <!-- This is the number PRINTED on the page, not the file position - see js/app.js -->
      <input class="pager__input" id="page-input" type="number" min="1"
             inputmode="numeric" aria-label="ไปที่หน้าที่พิมพ์เลขนี้">
      <span class="pager__total" id="page-total"></span>
    </form>

    <button type="button" id="btn-next" class="btn" aria-label="หน้าถัดไป">›</button>

    <span class="controls__sep"></span>

    <button type="button" id="btn-thumbs" class="btn btn--wide" aria-label="เลือกหน้า">☰</button>
    <button type="button" id="btn-zoom" class="btn btn--wide" aria-label="ขยายหน้านี้">🔍</button>
  </nav>

  <script src="lib/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
