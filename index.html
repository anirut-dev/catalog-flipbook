<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangudom Catalog 2021</title>
  <meta name="description" content="แคตตาล็อกสินค้า Sangudom Lighting Centre 2021 แบบพลิกหน้าอ่านได้">
  <link rel="stylesheet" href="lib/stPageFlip.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="pages/page-001.webp">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Sangudom Lighting Centre — Catalog 2021</h1>
  </header>

  <main class="viewer">
    <!-- StPageFlip forces width:100% on its own container, so the size limit
         has to live on this wrapper. js/app.js sets its width. -->
    <div class="book-frame" id="book-frame">
      <div id="flipbook" class="flipbook"></div>
    </div>

    <div class="loading" id="loading">กำลังโหลด…</div>
  </main>

  <nav class="controls" aria-label="ควบคุมการพลิกหน้า">
    <button type="button" id="btn-prev" class="btn" aria-label="หน้าก่อนหน้า">‹</button>

    <form class="pager" id="pager">
      <label class="pager__label" for="page-input">หน้า</label>
      <input class="pager__input" id="page-input" type="number" min="1" value="1"
             inputmode="numeric" aria-label="ไปที่หน้า">
      <span class="pager__total" id="page-total">/ 232</span>
    </form>

    <button type="button" id="btn-next" class="btn" aria-label="หน้าถัดไป">›</button>
  </nav>

  <script src="lib/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
